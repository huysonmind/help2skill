name: Publish

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# configure the "pypi" environment and the trusted publisher on pypi.org first.
#
# PyPI never accepts the same version twice, so nothing is uploaded unless the
# checks pass and the release tag (e.g. v0.1.0) matches the package version.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint and test
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pytest -q
      - run: uv build
      - name: Release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/help2skill-${version}-py3-none-any.whl" ]; then
            echo "::error::Release tag '$TAG' does not match the built package: $(ls dist)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
