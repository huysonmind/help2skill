[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "help2skill"
dynamic = ["version"]
description = "Make Python CLIs ready for LLM agents: --llms output, SKILL.md generation and drift checks for Click, Typer and argparse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "huysonmind", email = "350970572+huysonmind@users.noreply.github.com" }]
keywords = ["cli", "click", "typer", "argparse", "llm", "agents", "agent-skills", "skill-md", "llms-txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
# No runtime dependencies: Click and Typer are used only if your CLI already has them.
dependencies = []

[project.urls]
Homepage = "https://github.com/huysonmind/help2skill"
Issues = "https://github.com/huysonmind/help2skill/issues"
Changelog = "https://github.com/huysonmind/help2skill/blob/main/CHANGELOG.md"

[project.scripts]
help2skill = "help2skill.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "click>=8.1", "typer>=0.12", "ruff>=0.6", "mypy>=1.10"]

# The version lives in one place: src/help2skill/__init__.py.
[tool.hatch.version]
path = "src/help2skill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/help2skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
